<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trading Journal Cloud</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#f3f4f6;
display:flex;
justify-content:center;
padding:18px;
padding-bottom:100px;
color:#111827;
}

.app{
width:100%;
max-width:430px;
}

.page{display:none}
.active{display:block}

h1{
font-size:32px;
margin-bottom:18px;
}

.card{
background:white;
border-radius:24px;
padding:18px;
margin-bottom:16px;
box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.stats{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:12px;
margin-bottom:16px;
}

.stat-title{
font-size:13px;
opacity:.55;
margin-bottom:8px;
}

.stat-value{
font-size:23px;
font-weight:700;
}

input,textarea{
width:100%;
padding:16px;
border-radius:18px;
border:1px solid #e5e7eb;
background:#fafafa;
font-size:16px;
margin-top:12px;
}

textarea{
min-height:100px;
resize:none;
}

.save-btn{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:#374151;
color:white;
font-size:16px;
font-weight:700;
margin-top:14px;
cursor:pointer;
}

.trade{
background:white;
padding:16px;
border-radius:20px;
margin-bottom:12px;
box-shadow:0 3px 10px rgba(0,0,0,.04);
}

.green{color:#16a34a;font-weight:700}
.red{color:#c2185b;font-weight:700}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:76px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -3px 16px rgba(0,0,0,.06);
}

.nav{
background:none;
border:none;
color:#666;
font-size:13px;
cursor:pointer;
}

.chart-box{
height:240px;
padding:4px;
background:white;
}

.calendar-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
}

.arrow{
background:none;
border:none;
font-size:24px;
cursor:pointer;
}

.month{
font-size:22px;
font-weight:700;
}

.weekdays,
.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
}

.weekdays div{
text-align:center;
font-size:12px;
font-weight:700;
opacity:.5;
}

.day{
aspect-ratio:1/1;
border-radius:16px;
padding:6px;
display:flex;
align-items:center;
justify-content:center;
background:white;
box-shadow:0 2px 6px rgba(0,0,0,.03);
}

.green-bg{
background:#22c55e !important;
}

.green-bg .day-number{
color:white !important;
}

.red-bg{
background:#ef4444 !important;
}

.red-bg .day-number{
color:white !important;
}

.day-number{
font-size:14px;
font-weight:700;
}

.weekly-summary{
margin-top:16px;
border-top:1px solid #f3f4f6;
padding-top:14px;
}

.weekly-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0;
font-size:14px;
border-bottom:1px dashed #f3f4f6;
}

.weekly-row:last-child{
border-bottom:none;
}

.screenshot-btn{
margin-top:12px;
display:flex;
align-items:center;
justify-content:center;
width:52px;
height:52px;
border-radius:16px;
border:1px solid #e5e7eb;
background:#fafafa;
font-size:28px;
color:#374151;
cursor:pointer;
}

.screenshot-preview{
width:100%;
border-radius:18px;
margin-top:12px;
display:none;
}

.asset-chips{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:10px;
}

.chip{
background:#f3f4f6;
color:#374151;
padding:6px 12px;
border-radius:12px;
font-size:13px;
font-weight:600;
border:1px solid #e5e7eb;
cursor:pointer;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBwQIZ4_VwOYJjGPXBIQ2cBuWa53v8xCUk",
  authDomain: "zurnalas-app.firebaseapp.com",
  projectId: "zurnalas-app",
  storageBucket: "zurnalas-app.firebasestorage.app",
  messagingSenderId: "721221585239",
  appId: "1:721221585239:web:7ad195906ac6788f381612",
  measurementId: "G-28EFVE6GTF"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let trades = [];
let deposits = [];
let withdrawals = [];
let chart;

const now = new Date();
let currentMonth = now.getMonth();
let currentYear = now.getFullYear();

const months = [
'Sausis','Vasaris','Kovas','Balandis',
'Gegužė','Birželis','Liepa','Rugpjūtis',
'Rugsėjis','Spalis','Lapkritis','Gruodis'
];

function todayFormatted(){
const d = new Date();
return String(d.getDate()).padStart(2,'0') + '/' +
String(d.getMonth()+1).padStart(2,'0') + '/' +
String(d.getFullYear()).slice(-2);
}

let screenshotBase64 = '';

window.pickScreenshot = function(){
document.getElementById('screenshotInput').click();
}

window.handleScreenshot = function(event){
const file = event.target.files[0];
if(!file) return;
const reader = new FileReader();
reader.onload = function(e){
screenshotBase64 = e.target.result;
const preview = document.getElementById('screenshotPreview');
preview.src = screenshotBase64;
preview.style.display = 'block';
}
reader.readAsDataURL(file);
}

window.showPage = function(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
if(id === 'add') renderAssetSuggestions();
}

window.setAsset = function(name){
document.getElementById('asset').value = name;
}

function renderAssetSuggestions(){
const uniqueAssets = new Set();
trades.forEach(t => {
  if(t.asset && t.asset.trim()) uniqueAssets.add(t.asset.trim());
});

const datalist = document.getElementById('assetList');
datalist.innerHTML = '';
const chipsContainer = document.getElementById('assetChips');
chipsContainer.innerHTML = '';

uniqueAssets.forEach(asset => {
  const opt = document.createElement('option');
  opt.value = asset;
  datalist.appendChild(opt);

  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'chip';
  chip.innerText = asset;
  chip.onclick = () => setAsset(asset);
  chipsContainer.appendChild(chip);
});
}

window.addTrade = async function(){
const value = parseFloat(document.getElementById('profitInput').value.replace(',','.'));
if(isNaN(value)) return;

const trade = {
asset: document.getElementById('asset').value || 'Asset',
profit: value,
date: document.getElementById('date').value || todayFormatted(),
notes: document.getElementById('notes').value,
createdAt: Date.now(),
screenshot: screenshotBase64
};

await addDoc(collection(db,'trades'), trade);
await loadData();

document.getElementById('asset').value='';
document.getElementById('profitInput').value='';
document.getElementById('notes').value='';
screenshotBase64 = '';
document.getElementById('screenshotPreview').style.display = 'none';

showPage('home');
}

window.saveDeposit = async function(){
const value = parseFloat(document.getElementById('depositInput').value.replace(',','.'));
if(isNaN(value)) return;

const deposit = {
amount: value,
date: todayFormatted(),
createdAt: Date.now()
};

await addDoc(collection(db,'deposits'), deposit);
await loadData();
document.getElementById('depositInput').value='';
}

window.saveWithdrawal = async function(){
const value = parseFloat(document.getElementById('withdrawInput').value.replace(',','.'));
if(isNaN(value)) return;

const withdrawal = {
amount: value,
date: todayFormatted(),
createdAt: Date.now()
};

await addDoc(collection(db,'withdrawals'), withdrawal);
await loadData();
document.getElementById('withdrawInput').value='';
}

function parseDate(str){
const p = str.split('/');
return new Date('20'+p[2], p[1]-1, p[0]);
}

async function loadData(){
trades = [];
deposits = [];
withdrawals = [];

const [tradeSnapshot, depositSnapshot, withdrawalSnapshot] = await Promise.all([
  getDocs(collection(db,'trades')),
  getDocs(collection(db,'deposits')),
  getDocs(collection(db,'withdrawals'))
]);

tradeSnapshot.forEach(doc=>{
trades.push({ ...doc.data(), docId: doc.id });
});

depositSnapshot.forEach(doc=>{
deposits.push({ ...doc.data(), docId: doc.id });
});

withdrawalSnapshot.forEach(doc=>{
withdrawals.push({ ...doc.data(), docId: doc.id });
});

render();
renderAssetSuggestions();
}

window.deleteTrade = async function(id){
await deleteDoc(doc(db,'trades',id));
await loadData();
}

function render(){
const totalDeposits = deposits.reduce((a,b)=>a+(Number(b.amount)||0),0);
const totalWithdrawals = withdrawals.reduce((a,b)=>a+(Number(b.amount)||0),0);
const totalProfit = trades.reduce((a,b)=>a+(Number(b.profit)||0),0);
let total = totalDeposits - totalWithdrawals + totalProfit;

let wins = 0;
const history = document.getElementById('historyList');
history.innerHTML='';

const sortedHistory = [...trades].sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));

sortedHistory.forEach(t=>{
const p = Number(t.profit) || 0;
if(p > 0) wins++;

const div = document.createElement('div');
div.className='trade';
div.innerHTML=`
<div style="display:flex;justify-content:space-between;align-items:center;">
<strong>${t.asset}</strong>
<button onclick="deleteTrade('${t.docId}')" style="border:none;background:none;color:#ff2d55;font-size:18px;cursor:pointer;">✕</button>
</div>
<br>
<span class="${p >=0 ? 'green':'red'}">
${p >=0 ? '+' : ''}$${p.toFixed(2)}
</span>
<br><br>
${t.date}
<br>
<small>${t.notes || ''}</small>
${t.screenshot ? `<img src="${t.screenshot}" style="width:100%;border-radius:16px;margin-top:12px;">` : ''}
`;
history.appendChild(div);
});

document.getElementById('balance').innerText = '$'+total.toFixed(2);

const growth = totalDeposits > 0 ? ((totalProfit/totalDeposits)*100) : 0;
document.getElementById('growth').innerText = (growth >=0 ? '+' : '') + growth.toFixed(1) + '%';
document.getElementById('winrate').innerText = trades.length ? ((wins/trades.length)*100).toFixed(0) + '%' : '0%';

const daily = {};
trades.forEach(t=>{
const parts = (t.date || '').split('/');
if(parts.length === 3){
  const dateKey = '20'+parts[2]+'-'+parts[1]+'-'+parts[0];
  if(!daily[dateKey]) daily[dateKey] = 0;
  daily[dateKey] += (Number(t.profit) || 0);
}
});

drawCalendar(daily);
drawChart();
}

window.changeMonth = function(dir){
currentMonth += dir;
if(currentMonth < 0){
currentMonth = 11;
currentYear--;
}
if(currentMonth > 11){
currentMonth = 0;
currentYear++;
}
render();
}

function drawCalendar(daily){
const calendar = document.getElementById('calendar');
calendar.innerHTML='';
document.getElementById('monthTitle').innerText = months[currentMonth] + ' ' + currentYear;

let firstDay = new Date(currentYear,currentMonth,1).getDay();
if(firstDay === 0) firstDay = 7;
firstDay--;

const daysInMonth = new Date(currentYear,currentMonth+1,0).getDate();

for(let i=0;i<firstDay;i++){
const empty = document.createElement('div');
calendar.appendChild(empty);
}

const weeklyTotals = {};

for(let d=1; d<=daysInMonth; d++){
const date = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const value = daily[date];

const weekIndex = Math.ceil((d + firstDay) / 7);
if(!weeklyTotals[weekIndex]) weeklyTotals[weekIndex] = 0;
if(value !== undefined) weeklyTotals[weekIndex] += value;

const div = document.createElement('div');
div.className = 'day';

if(value > 0) div.classList.add('green-bg');
if(value < 0) div.classList.add('red-bg');

div.innerHTML = `<div class="day-number">${d}</div>`;
calendar.appendChild(div);
}

const weeklyContainer = document.getElementById('weeklySummary');
weeklyContainer.innerHTML = '';
Object.keys(weeklyTotals).forEach(w => {
  const profit = weeklyTotals[w];
  const row = document.createElement('div');
  row.className = 'weekly-row';
  row.innerHTML = `
    <span>${w} savaitė</span>
    <span class="${profit >= 0 ? 'green' : 'red'}">
      ${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}
    </span>
  `;
  weeklyContainer.appendChild(row);
});
}

function drawChart(){
const ctx = document.getElementById('equityChart');
if(chart){
chart.destroy();
}

const events = [];

deposits.forEach(d=>{
events.push({
date: d.date,
amount: Number(d.amount) || 0,
createdAt: d.createdAt ? Number(d.createdAt) : 1
});
});

withdrawals.forEach(w=>{
events.push({
date: w.date,
amount: -(Number(w.amount) || 0),
createdAt: w.createdAt ? Number(w.createdAt) : 2
});
});

trades.forEach(t=>{
events.push({
date: t.date,
amount: Number(t.profit) || 0,
createdAt: t.createdAt ? Number(t.createdAt) : 3
});
});

// Chronologinis rikiavimas pagal sukūrimo laiką
events.sort((a,b)=>{
  const diff = (a.createdAt || 0) - (b.createdAt || 0);
  if(diff !== 0) return diff;
  return parseDate(a.date) - parseDate(b.date);
});

let balance = 0;
const labels = [];
const data = [];

events.forEach((e)=>{
  balance += e.amount;
  // Po grafiku rodoma data (pvz. 15/09 arba 15/09/26)
  labels.push(e.date || '');
  data.push(balance);
});

chart = new Chart(ctx,{
type:'line',
data:{
labels:labels,
datasets:[{
data:data,
borderColor:'#64748b',
backgroundColor:'rgba(148,163,184,0.18)',
fill:true,
tension:0.3,
borderWidth:1.5,
pointRadius:3,
pointHoverRadius:5
}]
},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{
legend:{display:false},
tooltip:{
callbacks:{
label:(c) => ' Balansas: $' + c.parsed.y.toFixed(2)
}
}
},
scales:{
x:{
ticks:{
maxRotation:0,
minRotation:0,
autoSkip:true,
maxTicksLimit:6,
padding:8,
font:{
size:11
}
},
grid:{
display:false,
drawBorder:false
}
},
y:{
grid:{
display:true,
color:'rgba(148,163,184,0.18)',
borderDash:[2,6],
drawBorder:false
},
ticks:{
padding:10
}
}
}
}
});
}

window.onload = async ()=>{
document.getElementById('date').value = todayFormatted();
await loadData();
}
</script>
</head>
<body>

<div class="app">

<div id="home" class="page active">
<h1>Žurnalas</h1>

<div class="stats">
<div class="card">
<div class="stat-title">Balansas</div>
<div class="stat-value" id="balance">$0.00</div>
</div>

<div class="card">
<div class="stat-title">Growth</div>
<div class="stat-value" id="growth">0%</div>
</div>

<div class="card">
<div class="stat-title">Winrate</div>
<div class="stat-value" id="winrate">0%</div>
</div>
</div>

<div class="card">
<div class="calendar-header">
<button class="arrow" onclick="changeMonth(-1)">‹</button>
<div id="monthTitle" class="month"></div>
<button class="arrow" onclick="changeMonth(1)">›</button>
</div>

<div class="weekdays">
<div>P</div><div>A</div><div>T</div><div>K</div><div>Pn</div><div>Š</div><div>S</div>
</div>

<div id="calendar" class="calendar"></div>

<div class="weekly-summary">
<div class="stat-title">Savaičių rezultatai</div>
<div id="weeklySummary"></div>
</div>
</div>

<div class="card">
<div class="stat-title">Balanso grafikas</div>
<div class="chart-box">
<canvas id="equityChart"></canvas>
</div>
</div>

<div class="card">
<div class="stat-title">Depozitas ($)</div>
<input id="depositInput" placeholder="Įvesk depozitą">
<button class="save-btn" onclick="saveDeposit()">Išsaugoti</button>
</div>

<div class="card">
<div class="stat-title">Išėmimas ($)</div>
<input id="withdrawInput" placeholder="Įvesk išėmimą">
<button class="save-btn" onclick="saveWithdrawal()">Išsaugoti</button>
</div>
</div>

<div id="add" class="page">
<h1>Pridėti sandorį</h1>

<div class="card">
<input id="asset" list="assetList" placeholder="Asset (pvz. NZDUSD, oil)">
<datalist id="assetList"></datalist>

<div class="asset-chips" id="assetChips"></div>

<input id="profitInput" placeholder="Pelnas / Nuostolis ($)">
<input type="text" id="date" placeholder="dd/mm/yy">
<textarea id="notes" placeholder="Pastabos"></textarea>

<input type="file" id="screenshotInput" accept="image/*" onchange="handleScreenshot(event)" style="display:none;">
<button class="screenshot-btn" onclick="pickScreenshot()">＋</button>

<img id="screenshotPreview" class="screenshot-preview">

<button class="save-btn" onclick="addTrade()">Išsaugoti</button>
</div>
</div>

<div id="history" class="page">
<h1>History</h1>
<div id="historyList"></div>
</div>

<div class="bottom">
<button class="nav" onclick="showPage('home')">🏠 Home</button>
<button class="nav" onclick="showPage('add')">➕ Add</button>
<button class="nav" onclick="showPage('history')">📊 History</button>
</div>

</div>

</body>
</html>
