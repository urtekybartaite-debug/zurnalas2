<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trading Journal</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --bg-app: #f8fafc;
  --card-bg: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --green: #10b981;
  --red: #f43f5e;
  --border: #e2e8f0;
  --primary-btn: #0f172a;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg-app);
  display: flex;
  justify-content: center;
  padding: 16px;
  padding-bottom: 90px;
  color: var(--text-main);
}

.app{
  width: 100%;
  max-width: 420px;
}

.page{display:none}
.active{display:block}

h1{
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 8px 0 16px 4px;
}

.card{
  background: var(--card-bg);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
}

.stats{
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.stats .card{
  padding: 14px 12px;
  margin-bottom: 0;
}

.stat-title{
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.stat-value{
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

input, textarea{
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #f8fafc;
  font-size: 15px;
  margin-top: 10px;
  color: var(--text-main);
  outline: none;
}

input:focus, textarea:focus{
  border-color: #94a3b8;
  background: #fff;
}

textarea{
  min-height: 90px;
  resize: none;
}

.save-btn{
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: var(--primary-btn);
  color: white;
  font-size: 15px;
  font-weight: 600;
  margin-top: 12px;
  cursor: pointer;
}

/* Kalendorius */
.calendar-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.arrow{
  background: none;
  border: none;
  font-size: 22px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 10px;
}

.month{
  font-size: 18px;
  font-weight: 700;
}

.weekdays,
.calendar{
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.weekdays div{
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  padding-bottom: 4px;
}

.day{
  aspect-ratio: 1/1;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f8fafc;
  border: 1px solid #f1f5f9;
  font-size: 13px;
  font-weight: 600;
  color: #475569;
}

.day.empty{
  background: transparent;
  border: none;
}

.green-day{
  background: var(--green) !important;
  color: #ffffff !important;
  border-color: var(--green) !important;
}

.red-day{
  background: var(--red) !important;
  color: #ffffff !important;
  border-color: var(--red) !important;
}

.weekly-wrap{
  margin-top: 16px;
  border-top: 1px solid #f1f5f9;
  padding-top: 12px;
}

.weekly-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 4px;
  font-size: 13px;
  font-weight: 500;
}

.green-txt{ color: var(--green); font-weight: 700; }
.red-txt{ color: var(--red); font-weight: 700; }

.chart-box{
  height: 240px;
  padding: 4px;
  background: white;
}

.trade-card{
  background: white;
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: 16px;
  margin-bottom: 10px;
}

.screenshot-btn{
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #f8fafc;
  font-size: 20px;
  cursor: pointer;
}

.screenshot-preview{
  width: 100%;
  border-radius: 14px;
  margin-top: 10px;
  display: none;
}

/* Greitų instrumentų žymės */
.asset-chips{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.chip{
  background: #f1f5f9;
  color: #334155;
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid #e2e8f0;
  cursor: pointer;
}

.chip:active{
  background: #e2e8f0;
}

.bottom-bar{
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

.nav-btn{
  background: none;
  border: none;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.nav-btn.active{
  color: var(--text-main);
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBwQIZ4_VwOYJjGPXBIQ2cBuWa53v8xCUk",
  authDomain: "zurnalas-app.firebaseapp.com",
  projectId: "zurnalas-app",
  storageBucket: "zurnalas-app.firebasestorage.app",
  messagingSenderId: "721221585239",
  appId: "1:721221585239:web:7ad195906ac6788f381612",
  measurementId: "G-28EFVE6GTF"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let trades = [];
let deposits = [];
let withdrawals = [];
let chart;

const now = new Date();
let currentMonth = now.getMonth();
let currentYear = now.getFullYear();

const months = [
  'Sausis','Vasaris','Kovas','Balandis',
  'Gegužė','Birželis','Liepa','Rugpjūtis',
  'Rugsėjis','Spalis','Lapkritis','Gruodis'
];

function todayFormatted(){
  const d = new Date();
  return String(d.getDate()).padStart(2,'0') + '/' +
         String(d.getMonth()+1).padStart(2,'0') + '/' +
         String(d.getFullYear()).slice(-2);
}

let screenshotBase64 = '';

window.pickScreenshot = function(){
  document.getElementById('screenshotInput').click();
};

window.handleScreenshot = function(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    screenshotBase64 = e.target.result;
    const preview = document.getElementById('screenshotPreview');
    preview.src = screenshotBase64;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
};

window.showPage = function(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  if(event && event.currentTarget) event.currentTarget.classList.add('active');
  if(id === 'add') renderAssetSuggestions();
};

window.setAsset = function(name){
  document.getElementById('asset').value = name;
};

function renderAssetSuggestions(){
  const uniqueAssets = new Set();
  trades.forEach(t => {
    if(t.asset && t.asset.trim()) uniqueAssets.add(t.asset.trim());
  });

  const datalist = document.getElementById('assetList');
  datalist.innerHTML = '';

  const chipsContainer = document.getElementById('assetChips');
  chipsContainer.innerHTML = '';

  uniqueAssets.forEach(asset => {
    const opt = document.createElement('option');
    opt.value = asset;
    datalist.appendChild(opt);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.innerText = asset;
    chip.onclick = () => setAsset(asset);
    chipsContainer.appendChild(chip);
  });
}

window.addTrade = async function(){
  const val = parseFloat(document.getElementById('profitInput').value.replace(',','.'));
  if(isNaN(val)) return;

  const assetVal = document.getElementById('asset').value.trim() || 'Sandoris';

  const trade = {
    asset: assetVal,
    profit: val,
    date: document.getElementById('date').value.trim() || todayFormatted(),
    notes: document.getElementById('notes').value.trim(),
    createdAt: Date.now(),
    screenshot: screenshotBase64
  };

  await addDoc(collection(db,'trades'), trade);
  await loadData();

  document.getElementById('asset').value = '';
  document.getElementById('profitInput').value = '';
  document.getElementById('notes').value = '';
  screenshotBase64 = '';
  document.getElementById('screenshotPreview').style.display = 'none';

  showPage('home');
};

window.saveDeposit = async function(){
  const val = parseFloat(document.getElementById('depositInput').value.replace(',','.'));
  if(isNaN(val)) return;

  await addDoc(collection(db,'deposits'), {
    amount: val,
    date: todayFormatted(),
    createdAt: Date.now()
  });

  await loadData();
  document.getElementById('depositInput').value = '';
};

window.saveWithdrawal = async function(){
  const val = parseFloat(document.getElementById('withdrawInput').value.replace(',','.'));
  if(isNaN(val)) return;

  await addDoc(collection(db,'withdrawals'), {
    amount: val,
    date: todayFormatted(),
    createdAt: Date.now()
  });

  await loadData();
  document.getElementById('withdrawInput').value = '';
};

function parseDate(str){
  const p = str.split('/');
  return new Date('20'+p[2], p[1]-1, p[0]);
}

async function loadData(){
  trades = [];
  deposits = [];
  withdrawals = [];

  const [tSnap, dSnap, wSnap] = await Promise.all([
    getDocs(collection(db,'trades')),
    getDocs(collection(db,'deposits')),
    getDocs(collection(db,'withdrawals'))
  ]);

  tSnap.forEach(d => trades.push({ ...d.data(), docId: d.id }));
  dSnap.forEach(d => deposits.push({ ...d.data(), docId: d.id }));
  wSnap.forEach(d => withdrawals.push({ ...d.data(), docId: d.id }));

  render();
  renderAssetSuggestions();
}

window.deleteTrade = async function(id){
  await deleteDoc(doc(db,'trades', id));
  await loadData();
};

function render(){
  const totalDeposits = deposits.reduce((a,b)=>a+(Number(b.amount)||0), 0);
  const totalWithdrawals = withdrawals.reduce((a,b)=>a+(Number(b.amount)||0), 0);
  const totalProfit = trades.reduce((a,b)=>a+(Number(b.profit)||0), 0);
  const currentBalance = totalDeposits - totalWithdrawals + totalProfit;

  const sortedForHistory = [...trades].sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));

  let wins = 0;
  const history = document.getElementById('historyList');
  history.innerHTML = '';

  sortedForHistory.forEach(t=>{
    const p = Number(t.profit) || 0;
    if(p > 0) wins++;

    const div = document.createElement('div');
    div.className = 'trade-card';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong style="font-size:16px;">${t.asset}</strong>
        <button onclick="deleteTrade('${t.docId}')" style="border:none;background:none;color:#94a3b8;font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div style="margin-top:6px;font-size:18px;font-weight:700;" class="${p >= 0 ? 'green-txt' : 'red-txt'}">
        ${p >= 0 ? '+' : ''}$${p.toFixed(2)}
      </div>
      <div style="font-size:12px;color:#64748b;margin-top:4px;">${t.date}</div>
      ${t.notes ? `<div style="font-size:13px;margin-top:8px;color:#334155;">${t.notes}</div>` : ''}
      ${t.screenshot ? `<img src="${t.screenshot}" style="width:100%;border-radius:12px;margin-top:10px;">` : ''}
    `;
    history.appendChild(div);
  });

  document.getElementById('balance').innerText = '$' + currentBalance.toFixed(2);
  const growth = totalDeposits > 0 ? ((totalProfit/totalDeposits)*100) : 0;
  document.getElementById('growth').innerText = (growth >= 0 ? '+' : '') + growth.toFixed(1) + '%';
  document.getElementById('winrate').innerText = trades.length ? ((wins/trades.length)*100).toFixed(0) + '%' : '0%';

  const daily = {};
  trades.forEach(t=>{
    const parts = (t.date || '').split('/');
    if(parts.length === 3){
      const dateKey = '20'+parts[2]+'-'+parts[1]+'-'+parts[0];
      if(!daily[dateKey]) daily[dateKey] = 0;
      daily[dateKey] += (Number(t.profit) || 0);
    }
  });

  drawCalendar(daily);
  drawChart();
}

window.changeMonth = function(dir){
  currentMonth += dir;
  if(currentMonth < 0){
    currentMonth = 11;
    currentYear--;
  }
  if(currentMonth > 11){
    currentMonth = 0;
    currentYear++;
  }
  render();
};

function drawCalendar(daily){
  const calendar = document.getElementById('calendar');
  calendar.innerHTML = '';
  document.getElementById('monthTitle').innerText = months[currentMonth] + ' ' + currentYear;

  let firstDay = new Date(currentYear, currentMonth, 1).getDay();
  if(firstDay === 0) firstDay = 7;
  firstDay--;

  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();

  for(let i=0; i<firstDay; i++){
    const empty = document.createElement('div');
    empty.className = 'day empty';
    calendar.appendChild(empty);
  }

  const weeklyTotals = {};

  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const value = daily[dateStr];

    const weekIdx = Math.ceil((d + firstDay) / 7);
    if(!weeklyTotals[weekIdx]) weeklyTotals[weekIdx] = 0;
    if(value !== undefined) weeklyTotals[weekIdx] += value;

    const div = document.createElement('div');
    div.className = 'day';

    if(value > 0) div.classList.add('green-day');
    if(value < 0) div.classList.add('red-day');

    div.innerText = d;
    calendar.appendChild(div);
  }

  const weeklyContainer = document.getElementById('weeklySummary');
  weeklyContainer.innerHTML = '';
  Object.keys(weeklyTotals).forEach(w => {
    const profit = weeklyTotals[w];
    const row = document.createElement('div');
    row.className = 'weekly-row';
    row.innerHTML = `
      <span>${w} savaitė</span>
      <span class="${profit >= 0 ? 'green-txt' : 'red-txt'}">
        ${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}
      </span>
    `;
    weeklyContainer.appendChild(row);
  });
}

// ORIGINALUS GRAFIKAS IŠ PIRMOJO KODO SU TIKSLIU CHRONOLOGINIU RIKIAVIMU
function drawChart(){
  const ctx = document.getElementById('equityChart');
  if(chart){
    chart.destroy();
  }

  const events = [];

  deposits.forEach(d=>{
    events.push({
      date: d.date,
      amount: Number(d.amount) || 0,
      createdAt: d.createdAt ? Number(d.createdAt) : 1
    });
  });

  withdrawals.forEach(w=>{
    events.push({
      date: w.date,
      amount: -(Number(w.amount) || 0),
      createdAt: w.createdAt ? Number(w.createdAt) : 2
    });
  });

  trades.forEach(t=>{
    events.push({
      date: t.date,
      amount: Number(t.profit) || 0,
      createdAt: t.createdAt ? Number(t.createdAt) : 3
    });
  });

  // Chronologinis rikiavimas pagal įvedimo laiką
  events.sort((a,b)=>{
    const diff = (a.createdAt || 0) - (b.createdAt || 0);
    if(diff !== 0) return diff;
    return parseDate(a.date) - parseDate(b.date);
  });

  let balance = 0;
  const labels = [];
  const data = [];
  const monthIndexes = {};

  events.forEach((e, index)=>{
    balance += e.amount;
    const parts = (e.date || '').split('/');
    if(parts.length === 3){
      const monthLabel = parts[1] + '/' + parts[2];
      if(monthIndexes[monthLabel] === undefined){
        monthIndexes[monthLabel] = index;
      }
    }
    labels.push('');
    data.push(balance);
  });

  Object.keys(monthIndexes).forEach((month, i)=>{
    if(i !== 0){
      labels[monthIndexes[month]] = month;
    }
  });

  chart = new Chart(ctx,{
    type:'line',
    data:{
      labels: labels,
      datasets:[{
        data: data,
        borderColor: '#64748b',
        backgroundColor: 'rgba(148,163,184,0.18)',
        fill: true,
        tension: 0.4,
        borderWidth: 1.2,
        pointRadius: 0,
        pointHoverRadius: 0
      }]
    },
    options:{
      responsive: true,
      maintainAspectRatio: false,
      plugins:{
        legend: { display: false }
      },
      scales:{
        x:{
          ticks:{
            maxRotation: 0,
            minRotation: 0,
            autoSkip: true,
            maxTicksLimit: 8,
            padding: 10,
            font: { size: 11 },
            callback: function(value, index, ticks){
              const label = this.getLabelForValue(value);
              return label === '' ? null : label;
            }
          },
          grid:{
            display: false,
            drawBorder: false
          }
        },
        y:{
          grid:{
            display: true,
            color: 'rgba(148,163,184,0.18)',
            borderDash: [2,6],
            drawBorder: false
          },
          ticks:{
            padding: 10
          }
        }
      }
    }
  });
}

window.onload = async ()=>{
  document.getElementById('date').value = todayFormatted();
  await loadData();
};
</script>
</head>
<body>

<div class="app">

  <!-- PAGRINDINIS PUSLAPIS -->
  <div id="home" class="page active">
    <h1>Žurnalas</h1>

    <div class="stats">
      <div class="card">
        <div class="stat-title">Balansas</div>
        <div class="stat-value" id="balance">$0.00</div>
      </div>
      <div class="card">
        <div class="stat-title">Growth</div>
        <div class="stat-value" id="growth">0%</div>
      </div>
      <div class="card">
        <div class="stat-title">Winrate</div>
        <div class="stat-value" id="winrate">0%</div>
      </div>
    </div>

    <!-- Kalendoriaus kortelė -->
    <div class="card">
      <div class="calendar-header">
        <button class="arrow" onclick="changeMonth(-1)">‹</button>
        <div id="monthTitle" class="month"></div>
        <button class="arrow" onclick="changeMonth(1)">›</button>
      </div>

      <div class="weekdays">
        <div>P</div><div>A</div><div>T</div><div>K</div><div>Pn</div><div>Š</div><div>S</div>
      </div>

      <div id="calendar" class="calendar"></div>

      <div class="weekly-wrap">
        <div class="stat-title">Savaičių rezultatai</div>
        <div id="weeklySummary"></div>
      </div>
    </div>

    <!-- Balanso dinamika (originali išvaizda) -->
    <div class="card">
      <div class="stat-title">Balanso grafikas</div>
      <div class="chart-box">
        <canvas id="equityChart"></canvas>
      </div>
    </div>

    <!-- Depozitas -->
    <div class="card">
      <div class="stat-title">Depozitas ($)</div>
      <input id="depositInput" type="number" step="any" placeholder="Suma">
      <button class="save-btn" onclick="saveDeposit()">Išsaugoti depozitą</button>
    </div>

    <!-- Išėmimas -->
    <div class="card">
      <div class="stat-title">Išėmimas ($)</div>
      <input id="withdrawInput" type="number" step="any" placeholder="Suma">
      <button class="save-btn" onclick="saveWithdrawal()">Išsaugoti išėmimą</button>
    </div>
  </div>

  <!-- SANDORIO PRIDĖJIMAS -->
  <div id="add" class="page">
    <h1>Naujas sandoris</h1>
    <div class="card">
      <input id="asset" list="assetList" placeholder="Instrumentas (pvz. NZDUSD, oil, EURUSD)">
      <datalist id="assetList"></datalist>

      <div class="asset-chips" id="assetChips"></div>

      <input id="profitInput" placeholder="Pelnas / Nuostolis ($) (pvz. 5.58 arba -3)">
      <input type="text" id="date" placeholder="dd/mm/yy">
      <textarea id="notes" placeholder="Sandorio pastabos"></textarea>
      
      <input type="file" id="screenshotInput" accept="image/*" onchange="handleScreenshot(event)" style="display:none;">
      <button class="screenshot-btn" onclick="pickScreenshot()">📷</button>
      <img id="screenshotPreview" class="screenshot-preview">

      <button class="save-btn" onclick="addTrade()">Išsaugoti sandorį</button>
    </div>
  </div>

  <!-- ISTORIJA -->
  <div id="history" class="page">
    <h1>Sandorių istorija</h1>
    <div id="historyList"></div>
  </div>

  <!-- APAČIOS NAVIGACIJA -->
  <div class="bottom-bar">
    <button class="nav-btn active" onclick="showPage('home')">
      <span>🏠</span>
      <span>Pradžia</span>
    </button>
    <button class="nav-btn" onclick="showPage('add')">
      <span>➕</span>
      <span>Sandoris</span>
    </button>
    <button class="nav-btn" onclick="showPage('history')">
      <span>📊</span>
      <span>Istorija</span>
    </button>
  </div>

</div>

</body>
</html>
